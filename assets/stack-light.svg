<svg xmlns="http://www.w3.org/2000/svg" width="900" height="360" viewBox="0 0 900 360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f3f6fb"/>
    </linearGradient>
    <linearGradient id="barO" x1="0" x2="1"><stop offset="0" stop-color="#FF6B35"/><stop offset="1" stop-color="#ea580c"/></linearGradient>
    <linearGradient id="barB" x1="0" x2="1"><stop offset="0" stop-color="#1e88c8"/><stop offset="1" stop-color="#29B5E8"/></linearGradient>
    <linearGradient id="barG" x1="0" x2="1"><stop offset="0" stop-color="#1f9d3a"/><stop offset="1" stop-color="#1a7f37"/></linearGradient>
    <linearGradient id="shine" x1="0" x2="1">
      <stop offset="0" stop-color="#111827" stop-opacity="0"/>
      <stop offset=".5" stop-color="#111827" stop-opacity=".35"/>
      <stop offset="1" stop-color="#111827" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect width="900" height="360" rx="20"/></clipPath>
  </defs>
  <style>
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
    .row { opacity: 0; animation: in .5s ease-out forwards; }
    @keyframes in { from { opacity: 0; transform: translateX(-12px); } to { opacity: 1; transform: none; } }
    .ok { opacity: 0; animation: show .3s forwards; }
    @keyframes show { to { opacity: 1; } }
    .spin { animation: sp 1s linear infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="360" fill="url(#bg)"/>

    <!-- top bar, Spark UI style -->
    <rect width="900" height="52" fill="#000000" fill-opacity=".03"/>
    <text x="32" y="33" class="sans" font-size="17" font-weight="800" fill="#FF6B35">Spark</text>
    <text x="84" y="33" class="sans" font-size="11" fill="#6b7280">4.x</text>
    <text x="120" y="33" class="sans" font-size="14" fill="#374151">Jobs  ›  <tspan font-weight="700" fill="#111827">job 0: mayank.stack()</tspan></text>
    <text x="868" y="33" text-anchor="end" class="mono" font-size="12" fill="#6b7280">executors: <tspan fill="#1a7f37">caffeine x ∞</tspan></text>

    <!-- column headers -->
    <g class="mono" font-size="11" fill="#9ca3af">
      <text x="32" y="80">STAGE</text>
      <text x="92" y="80">DESCRIPTION</text>
      <text x="250" y="80">TOOLING</text>
      <text x="540" y="80">TASKS</text>
      <text x="868" y="80" text-anchor="end">STATUS</text>
    </g>
    <line x1="32" y1="90" x2="868" y2="90" stroke="#111827" stroke-opacity=".08"/>

    <!-- rows: y step 42 starting at 118 -->
    <!-- 0 -->
    <g class="row" style="animation-delay:.1s">
      <text x="32" y="118" class="mono" font-size="13" fill="#6b7280">0</text>
      <text x="92" y="118" class="sans" font-size="14" font-weight="700" fill="#111827">ingest</text>
      <text x="250" y="118" class="mono" font-size="12.5" fill="#374151">S3 · Kafka · REST · unstructured docs</text>
      <rect x="540" y="106" width="170" height="14" rx="7" fill="#111827" fill-opacity=".06"/>
      <rect x="540" y="106" height="14" rx="7" fill="url(#barO)" width="0"><animate attributeName="width" from="0" to="170" begin=".3s" dur="1s" fill="freeze"/></rect>
      <text x="722" y="118" class="mono" font-size="11" fill="#6b7280">512/512</text>
      <g class="ok" style="animation-delay:1.3s"><text x="868" y="118" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#1a7f37">SUCCEEDED</text></g>
    </g>
    <!-- 1 -->
    <g class="row" style="animation-delay:.3s">
      <text x="32" y="160" class="mono" font-size="13" fill="#6b7280">1</text>
      <text x="92" y="160" class="sans" font-size="14" font-weight="700" fill="#111827">transform</text>
      <text x="250" y="160" class="mono" font-size="12.5" fill="#374151">Scala · Spark · PySpark · SQL</text>
      <rect x="540" y="148" width="170" height="14" rx="7" fill="#111827" fill-opacity=".06"/>
      <rect x="540" y="148" height="14" rx="7" fill="url(#barO)" width="0"><animate attributeName="width" from="0" to="170" begin="1.1s" dur="1.2s" fill="freeze"/></rect>
      <text x="722" y="160" class="mono" font-size="11" fill="#6b7280">2048/2048</text>
      <g class="ok" style="animation-delay:2.3s"><text x="868" y="160" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#1a7f37">SUCCEEDED</text></g>
    </g>
    <!-- 2 -->
    <g class="row" style="animation-delay:.5s">
      <text x="32" y="202" class="mono" font-size="13" fill="#6b7280">2</text>
      <text x="92" y="202" class="sans" font-size="14" font-weight="700" fill="#111827">warehouse</text>
      <text x="250" y="202" class="mono" font-size="12.5" fill="#374151">Snowflake · Hive · Oracle · Postgres</text>
      <rect x="540" y="190" width="170" height="14" rx="7" fill="#111827" fill-opacity=".06"/>
      <rect x="540" y="190" height="14" rx="7" fill="url(#barB)" width="0"><animate attributeName="width" from="0" to="170" begin="2s" dur="1s" fill="freeze"/></rect>
      <text x="722" y="202" class="mono" font-size="11" fill="#6b7280">256/256</text>
      <g class="ok" style="animation-delay:3s"><text x="868" y="202" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#1a7f37">SUCCEEDED</text></g>
    </g>
    <!-- 3 -->
    <g class="row" style="animation-delay:.7s">
      <text x="32" y="244" class="mono" font-size="13" fill="#6b7280">3</text>
      <text x="92" y="244" class="sans" font-size="14" font-weight="700" fill="#111827">orchestrate</text>
      <text x="250" y="244" class="mono" font-size="12.5" fill="#374151">OpenShift · Kubernetes · Docker</text>
      <rect x="540" y="232" width="170" height="14" rx="7" fill="#111827" fill-opacity=".06"/>
      <rect x="540" y="232" height="14" rx="7" fill="url(#barB)" width="0"><animate attributeName="width" from="0" to="170" begin="2.7s" dur="1s" fill="freeze"/></rect>
      <text x="722" y="244" class="mono" font-size="11" fill="#6b7280">128/128</text>
      <g class="ok" style="animation-delay:3.7s"><text x="868" y="244" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#1a7f37">SUCCEEDED</text></g>
    </g>
    <!-- 4 -->
    <g class="row" style="animation-delay:.9s">
      <text x="32" y="286" class="mono" font-size="13" fill="#6b7280">4</text>
      <text x="92" y="286" class="sans" font-size="14" font-weight="700" fill="#111827">ship</text>
      <text x="250" y="286" class="mono" font-size="12.5" fill="#374151">Swift · SwiftUI · Next.js · Vercel</text>
      <rect x="540" y="274" width="170" height="14" rx="7" fill="#111827" fill-opacity=".06"/>
      <rect x="540" y="274" height="14" rx="7" fill="url(#barG)" width="0"><animate attributeName="width" values="0;125;125" keyTimes="0;.6;1" begin="3.4s" dur="2s" fill="freeze"/></rect>
      <rect x="540" y="274" width="60" height="14" rx="7" fill="url(#shine)" opacity=".8">
        <animate attributeName="x" values="520;670" dur="1.6s" begin="5.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;.8" dur=".1s" begin="5.4s" fill="freeze"/>
      </rect>
      <text x="722" y="286" class="mono" font-size="11" fill="#6b7280">after 6pm</text>
      <g class="ok" style="animation-delay:3.6s">
        <circle class="spin" cx="808" cy="282" r="5" fill="none" stroke="#29B5E8" stroke-width="2" stroke-dasharray="20 12"/>
        <text x="868" y="286" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#29B5E8">RUNNING</text>
      </g>
    </g>
    <!-- 5 -->
    <g class="row" style="animation-delay:1.1s">
      <text x="32" y="328" class="mono" font-size="13" fill="#6b7280">5</text>
      <text x="92" y="328" class="sans" font-size="14" font-weight="700" fill="#111827">homelab</text>
      <text x="250" y="328" class="mono" font-size="12.5" fill="#374151">Raspberry Pi · Umbrel · self-hosting</text>
      <rect x="540" y="316" width="170" height="14" rx="7" fill="#111827" fill-opacity=".06"/>
      <rect x="540" y="316" height="14" rx="7" fill="url(#barG)" width="0"><animate attributeName="width" values="0;170;0" keyTimes="0;.85;1" begin="4s" dur="5s" repeatCount="indefinite"/></rect>
      <text x="722" y="328" class="mono" font-size="11" fill="#6b7280">24/7</text>
      <g class="ok" style="animation-delay:4s">
        <circle class="spin" cx="808" cy="324" r="5" fill="none" stroke="#29B5E8" stroke-width="2" stroke-dasharray="20 12"/>
        <text x="868" y="328" text-anchor="end" class="mono" font-size="11" font-weight="700" fill="#29B5E8">RUNNING</text>
      </g>
    </g>

    <rect x="1" y="1" width="898" height="358" rx="19" fill="none" stroke="#000000" stroke-opacity=".08"/>
  </g>
</svg>
