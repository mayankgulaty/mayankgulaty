<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e16"/>
      <stop offset="1" stop-color="#121a2a"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B35"/>
      <stop offset="0.55" stop-color="#FF9F45"/>
      <stop offset="1" stop-color="#29B5E8"/>
    </linearGradient>
    <radialGradient id="glowO" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B35" stop-opacity=".35"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#29B5E8" stop-opacity=".3"/>
      <stop offset="1" stop-color="#29B5E8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#ffffff" stroke-opacity=".045"/>
    </pattern>
    <clipPath id="card"><rect width="900" height="300" rx="20"/></clipPath>
    <clipPath id="typed">
      <rect x="56" y="44" height="28" width="0">
        <animate attributeName="width" values="0;0;540;540" keyTimes="0;0.08;0.55;1" dur="4s" fill="freeze"/>
      </rect>
    </clipPath>
    <path id="p1" d="M640 70 C 700 70, 700 150, 760 150"/>
    <path id="p2" d="M640 230 C 700 230, 700 150, 760 150"/>
    <path id="p3" d="M760 150 C 800 150, 800 90, 850 90"/>
    <path id="p4" d="M760 150 C 800 150, 800 210, 850 210"/>
    <path id="p5" d="M640 150 L 760 150"/>
  </defs>

  <style>
    .mono { font-family: 'SFMono-Regular', Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Ubuntu, Arial, sans-serif; }
    .rot { opacity: 0; animation: rot 9s infinite; }
    .r2 { animation-delay: 3s; }
    .r3 { animation-delay: 6s; }
    @keyframes rot {
      0%   { opacity: 0; transform: translateY(10px); }
      5%   { opacity: 1; transform: translateY(0); }
      28%  { opacity: 1; transform: translateY(0); }
      33%  { opacity: 0; transform: translateY(-10px); }
      100% { opacity: 0; }
    }
    .blink { animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .name { opacity: 0; animation: up .9s ease-out 1.6s forwards; }
    .chips { opacity: 0; animation: up .9s ease-out 2.3s forwards; }
    @keyframes up { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
    .node { animation: pulse 3s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    .n2 { animation-delay: .6s; } .n3 { animation-delay: 1.2s; } .n4 { animation-delay: 1.8s; }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.18); } }
  </style>

  <g clip-path="url(#card)">
    <rect width="900" height="300" fill="url(#bg)"/>
    <rect width="900" height="300" fill="url(#grid)"/>
    <circle cx="120" cy="250" r="220" fill="url(#glowO)"/>
    <circle cx="800" cy="60" r="200" fill="url(#glowB)"/>

    <!-- window chrome -->
    <circle cx="30" cy="22" r="5" fill="#ff5f57"/>
    <circle cx="48" cy="22" r="5" fill="#febc2e"/>
    <circle cx="66" cy="22" r="5" fill="#28c840"/>
    <text x="450" y="26" text-anchor="middle" class="mono" font-size="11" fill="#5b6b85">~/dublin — zsh</text>

    <!-- typed command -->
    <g clip-path="url(#typed)">
      <text x="56" y="64" class="mono" font-size="16">
        <tspan fill="#28c840">mayank@dublin</tspan><tspan fill="#5b6b85">:</tspan><tspan fill="#29B5E8">~</tspan><tspan fill="#5b6b85">$ </tspan><tspan fill="#e6edf3">spark-submit --class Mayank life.jar</tspan>
      </text>
    </g>
    <rect y="49" width="9" height="19" fill="#FF9F45" class="blink">
      <animate attributeName="x" values="56;56;596;596" keyTimes="0;0.08;0.55;1" dur="4s" fill="freeze"/>
    </rect>

    <!-- name -->
    <g class="name">
      <text x="54" y="148" class="sans" font-size="60" font-weight="800" letter-spacing="-1.5" fill="url(#brand)">Mayank Gulaty</text>
    </g>

    <!-- rotating subtitle -->
    <g class="sans" font-size="20" fill="#c9d4e5">
      <text x="56" y="188" class="rot r1">Data Engineer moving <tspan fill="#FF9F45" font-weight="700">billions of rows</tspan> with Spark &amp; Scala</text>
      <text x="56" y="188" class="rot r2">Shipping <tspan fill="#29B5E8" font-weight="700">native iOS apps</tspan> after the pipelines go green</text>
      <text x="56" y="188" class="rot r3">Marathoner. 4 down, <tspan fill="#FF9F45" font-weight="700">Tokyo 2027</tspan> loading...</text>
    </g>

    <!-- chips -->
    <g class="chips mono" font-size="12">
      <rect x="56" y="222" width="132" height="28" rx="14" fill="#FF6B35" fill-opacity=".12" stroke="#FF6B35" stroke-opacity=".5"/>
      <circle cx="72" cy="236" r="4" fill="#FF6B35"/>
      <text x="82" y="240" fill="#ffb38f">9 yrs in data</text>

      <rect x="198" y="222" width="190" height="28" rx="14" fill="#29B5E8" fill-opacity=".12" stroke="#29B5E8" stroke-opacity=".5"/>
      <circle cx="214" cy="236" r="4" fill="#29B5E8"/>
      <text x="224" y="240" fill="#9fdcf4">Spark · Snowflake · S3</text>

      <rect x="398" y="222" width="150" height="28" rx="14" fill="#28c840" fill-opacity=".1" stroke="#28c840" stroke-opacity=".45"/>
      <circle cx="414" cy="236" r="4" fill="#28c840"><animate attributeName="opacity" values="1;.2;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="424" y="240" fill="#9be9a8">Dublin, Ireland</text>
    </g>

    <!-- mini DAG -->
    <g fill="none" stroke-width="1.5">
      <use href="#p1" stroke="#FF6B35" stroke-opacity=".35"/>
      <use href="#p2" stroke="#FF6B35" stroke-opacity=".35"/>
      <use href="#p5" stroke="#FF9F45" stroke-opacity=".35"/>
      <use href="#p3" stroke="#29B5E8" stroke-opacity=".35"/>
      <use href="#p4" stroke="#29B5E8" stroke-opacity=".35"/>
    </g>
    <g>
      <circle r="3.5" fill="#FF9F45"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
      <circle r="3.5" fill="#FF9F45"><animateMotion dur="2.2s" begin="0.7s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
      <circle r="3.5" fill="#FF9F45"><animateMotion dur="1.8s" begin="0.3s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
      <circle r="3.5" fill="#29B5E8"><animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
      <circle r="3.5" fill="#29B5E8"><animateMotion dur="1.8s" begin="1.1s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
    </g>
    <g class="mono" font-size="9" fill="#7d8ba3" text-anchor="middle">
      <rect class="node" x="626" y="58" width="28" height="24" rx="6" fill="#1b2433" stroke="#FF6B35"/>
      <text x="640" y="100">s3</text>
      <rect class="node n2" x="626" y="138" width="28" height="24" rx="6" fill="#1b2433" stroke="#FF6B35"/>
      <text x="640" y="180">kafka</text>
      <rect class="node n3" x="626" y="218" width="28" height="24" rx="6" fill="#1b2433" stroke="#FF6B35"/>
      <text x="640" y="260">api</text>
      <circle class="node" cx="760" cy="150" r="20" fill="#1b2433" stroke="url(#brand)" stroke-width="2"/>
      <text x="760" y="154" fill="#FF9F45" font-size="10" font-weight="700">spark</text>
      <rect class="node n4" x="836" y="78" width="28" height="24" rx="6" fill="#1b2433" stroke="#29B5E8"/>
      <text x="850" y="120">dwh</text>
      <rect class="node n2" x="836" y="198" width="28" height="24" rx="6" fill="#1b2433" stroke="#29B5E8"/>
      <text x="850" y="240">apps</text>
    </g>

    <rect x="1" y="1" width="898" height="298" rx="19" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
  </g>
</svg>
